name: Check data & deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Three gates; any failure blocks deployment. Since the 2026-09-19 switchover
  # streets-data.js is the generator's output, committed alongside the
  # documents that changed it (handbook/PUBLISHING.md).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The contract the map relies on (labels, vocabulary, sources, bands
      # tiling, timelines ending in the current name). --require-generated
      # is the hand-edit tripwire: a streets-data.js without the generator's
      # header cannot deploy.
      - name: Validate street data
        run: node tools/check-data.js --require-generated
      # The authored layers behind it (names.js, documents/). Gating since
      # 2026-09-15 (switchover checklist E).
      - name: Validate names and documents
        run: node tools/check-model.js
      # The committed streets-data.js and generated/search-index.js must be
      # what a fresh build produces. If this fails, someone pushed documents
      # or names.js without running `node tools/generate.js` and committing its
      # output (or edited the generated file by hand): regenerate, commit, push.
      #
      # tools/generate.js exits 1 whenever a row cannot be placed on the geometry
      # (see generated/report.md). Such rows are DROPPED and the files are
      # still written whole, so that alone does not hold the site back — a few
      # are expected at any time. A generator that crashed mid-run is different:
      # it never prints its summary line, and that fails the step.
      - name: Regeneration check
        run: |
          node tools/generate.js > generate.log 2>&1 || true
          cat generate.log
          grep -q '^Generated ' generate.log || { echo "::error::tools/generate.js did not finish"; exit 1; }
          git diff --exit-code -- generated/streets-data.js generated/search-index.js \
            || { echo "::error::committed generated/streets-data.js / generated/search-index.js differ from a fresh build — run 'node tools/generate.js' and commit the result"; exit 1; }

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
